<svg viewBox="0 0 1000 700" width="1000" height="700" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#05060f"/>
      <stop offset="55%" stop-color="#0b0f22"/>
      <stop offset="100%" stop-color="#120a24"/>
    </linearGradient>
    <linearGradient id="neonEdge" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#00fff2"/>
      <stop offset="50%" stop-color="#8a2fff"/>
      <stop offset="100%" stop-color="#ff2fd6"/>
    </linearGradient>
    <linearGradient id="armor" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2c3550"/>
      <stop offset="55%" stop-color="#161c30"/>
      <stop offset="100%" stop-color="#0b0f1c"/>
    </linearGradient>
    <radialGradient id="visor" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#eafcff"/>
      <stop offset="45%" stop-color="#00e5ff"/>
      <stop offset="100%" stop-color="#0091b3" stop-opacity="0.3"/>
    </radialGradient>
    <radialGradient id="core" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fff9dc"/>
      <stop offset="35%" stop-color="#ff2fd6"/>
      <stop offset="100%" stop-color="#ff2fd6" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="thruster" cx="50%" cy="0%" r="80%">
      <stop offset="0%" stop-color="#00fff2" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#8a2fff" stop-opacity="0"/>
    </radialGradient>
    <filter id="glow"><feGaussianBlur stdDeviation="4" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <pattern id="hex" width="46" height="40" patternUnits="userSpaceOnUse">
      <polygon points="23,0 46,12 46,32 23,44 0,32 0,12" fill="none" stroke="#1c2b4a" stroke-width="1"/>
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="1000" height="700" fill="url(#bg)"/>
  <rect width="1000" height="700" fill="url(#hex)" opacity="0.35"/>

  <!-- drifting particles -->
  <g fill="#7df9ff">
    <circle cx="70" cy="50" r="1.6"><animate attributeName="opacity" values="0.1;1;0.1" dur="3s" repeatCount="indefinite"/></circle>
    <circle cx="920" cy="70" r="1.8"><animate attributeName="opacity" values="1;0.2;1" dur="2.6s" repeatCount="indefinite"/></circle>
    <circle cx="870" cy="300" r="1.4"><animate attributeName="opacity" values="0.2;1;0.2" dur="3.4s" repeatCount="indefinite"/></circle>
    <circle cx="60" cy="290" r="1.5"><animate attributeName="opacity" values="1;0.2;1" dur="2.9s" repeatCount="indefinite"/></circle>
    <circle cx="480" cy="30" r="1.3"><animate attributeName="opacity" values="0.3;1;0.3" dur="2.4s" repeatCount="indefinite"/></circle>
  </g>

  <!-- outer border frame, neon -->
  <rect x="4" y="4" width="992" height="692" rx="14" fill="none" stroke="url(#neonEdge)" stroke-width="2" opacity="0.55"/>

  <!-- ============ ROBOT (floating, gamified armor) ============ -->
  <g id="agent" transform="translate(120,40)">
    <animateTransform attributeName="transform" type="translate" values="120,40; 120,24; 120,40" dur="3.6s" repeatCount="indefinite" additive="sum"/>

    <!-- hex platform / orbit rings -->
    <ellipse cx="90" cy="245" rx="130" ry="20" fill="none" stroke="#3a2f6b" stroke-width="1.5" opacity="0.5"/>
    <ellipse cx="90" cy="245" rx="100" ry="14" fill="none" stroke="#00fff2" stroke-width="1" opacity="0.4">
      <animateTransform attributeName="transform" type="rotate" values="0 90 245;360 90 245" dur="9s" repeatCount="indefinite"/>
    </ellipse>
    <circle r="4" fill="#ff2fd6" filter="url(#glow)">
      <animateMotion dur="5s" repeatCount="indefinite" path="M 90,245 m -130,0 a 130,20 0 1,0 260,0 a 130,20 0 1,0 -260,0"/>
    </circle>
    <circle r="3.5" fill="#00fff2" filter="url(#glow)">
      <animateMotion dur="5s" begin="-2.5s" repeatCount="indefinite" path="M 90,245 m -130,0 a 130,20 0 1,0 260,0 a 130,20 0 1,0 -260,0"/>
    </circle>

    <!-- thruster -->
    <ellipse cx="90" cy="258" rx="34" ry="10" fill="url(#thruster)">
      <animate attributeName="ry" values="8;16;8" dur="1.1s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.5;1;0.5" dur="1.1s" repeatCount="indefinite"/>
    </ellipse>

    <!-- legs: angular armored -->
    <polygon points="60,190 82,190 84,235 66,240 55,225" fill="url(#armor)" stroke="url(#neonEdge)" stroke-width="1.5"/>
    <polygon points="98,190 120,190 125,225 114,240 96,235" fill="url(#armor)" stroke="url(#neonEdge)" stroke-width="1.5"/>
    <polygon points="52,232 88,236 84,248 50,246" fill="#0b0f1c" stroke="#00fff2" stroke-width="1"/>
    <polygon points="92,236 128,232 130,246 96,248" fill="#0b0f1c" stroke="#00fff2" stroke-width="1"/>

    <!-- torso: angular chestplate -->
    <polygon points="45,115 135,115 128,200 90,210 52,200" fill="url(#armor)" stroke="url(#neonEdge)" stroke-width="2"/>
    <polygon points="60,128 120,128 116,150 64,150" fill="#0d1730" stroke="#8a2fff" stroke-width="1" opacity="0.8"/>
    <!-- power core -->
    <polygon points="90,150 104,163 90,176 76,163" fill="url(#core)">
      <animateTransform attributeName="transform" type="rotate" values="0 90 163;360 90 163" dur="4s" repeatCount="indefinite"/>
    </polygon>
    <circle cx="90" cy="163" r="5" fill="#fff9dc"/>
    <!-- side shoulder spikes -->
    <polygon points="45,115 20,105 30,135 45,140" fill="url(#armor)" stroke="url(#neonEdge)" stroke-width="1.5"/>
    <polygon points="135,115 160,105 150,135 135,140" fill="url(#armor)" stroke="url(#neonEdge)" stroke-width="1.5"/>

    <!-- arms sway -->
    <g>
      <animateTransform attributeName="transform" type="rotate" values="-6 40 140; 6 40 140; -6 40 140" dur="3.6s" repeatCount="indefinite"/>
      <polygon points="26,132 44,132 40,188 22,186" fill="url(#armor)" stroke="url(#neonEdge)" stroke-width="1.5"/>
      <polygon points="18,182 44,184 40,198 20,196" fill="#0b0f1c" stroke="#ff2fd6" stroke-width="1"/>
    </g>
    <g>
      <animateTransform attributeName="transform" type="rotate" values="6 140 140; -6 140 140; 6 140 140" dur="3.6s" repeatCount="indefinite"/>
      <polygon points="136,132 154,132 158,186 140,188" fill="url(#armor)" stroke="url(#neonEdge)" stroke-width="1.5"/>
      <polygon points="136,184 162,182 160,196 140,198" fill="#0b0f1c" stroke="#ff2fd6" stroke-width="1"/>
    </g>

    <!-- neck -->
    <rect x="78" y="100" width="24" height="18" fill="#0d1730"/>

    <!-- head: angular helmet -->
    <polygon points="55,45 125,45 132,75 118,105 62,105 48,75" fill="url(#armor)" stroke="url(#neonEdge)" stroke-width="2"/>
    <!-- crest -->
    <polygon points="90,45 78,20 102,20" fill="url(#neonEdge)" opacity="0.85">
      <animate attributeName="opacity" values="0.5;1;0.5" dur="1.6s" repeatCount="indefinite"/>
    </polygon>
    <!-- visor -->
    <polygon points="62,65 118,65 112,86 68,86" fill="#08131f"/>
    <polygon points="62,65 118,65 112,86 68,86" fill="url(#visor)" opacity="0.9">
      <animate attributeName="opacity" values="0.6;1;0.6" dur="1.8s" repeatCount="indefinite"/>
    </polygon>
    <rect x="64" y="73" width="52" height="2" fill="#ffffff" opacity="0.9">
      <animate attributeName="y" values="66;84;66" dur="2s" repeatCount="indefinite"/>
    </rect>

    <!-- ambient outer glow -->
    <ellipse cx="90" cy="150" rx="100" ry="120" fill="none" stroke="#8a2fff" stroke-width="1" opacity="0.18" filter="url(#glow)"/>
  </g>

  <!-- ============ HUD / GREETING PANEL ============ -->
  <g font-family="Consolas, 'Courier New', monospace">

    <!-- boot bar -->
    <text x="470" y="55" fill="#00fff2" font-size="14" letter-spacing="1">
      &gt; INITIALIZING PROFILE.EXE
    </text>
    <rect x="470" y="65" width="300" height="8" rx="4" fill="#131a30" stroke="#2c3a5c"/>
    <rect x="470" y="65" width="0" height="8" rx="4" fill="url(#neonEdge)">
      <animate attributeName="width" values="0;300;300;0" keyTimes="0;0.2;0.9;1" dur="9s" repeatCount="indefinite"/>
    </rect>

    <!-- cycling greeting lines -->
    <g font-size="30" font-weight="bold">
      <text x="470" y="130" fill="#ffffff" opacity="0">
        <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.05;0.2;0.24" dur="9s" repeatCount="indefinite"/>
        ⚡ SYSTEM ONLINE
      </text>
      <text x="470" y="130" fill="#00fff2" opacity="0">
        <animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.24;0.28;0.45;0.49" dur="9s" repeatCount="indefinite"/>
        Welcome, Explorer 👾
      </text>
      <text x="470" y="130" fill="#ff2fd6" opacity="0">
        <animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.49;0.53;0.7;0.74" dur="9s" repeatCount="indefinite"/>
        You found ARIA's HQ
      </text>
      <text x="470" y="130" fill="#8a2fff" opacity="0">
        <animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.74;0.78;0.95;1" dur="9s" repeatCount="indefinite"/>
        Ready, Player One?
      </text>
    </g>

    <text x="470" y="165" fill="#c8d6f0" font-size="18" opacity="0">
      <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.1;0.9;1" dur="9s" repeatCount="indefinite"/>
      🚀 AI Engineer Data Scientist &amp; ML Engineer
    </text>

    <!-- stat bars, gamified -->
    <g font-size="13" fill="#9fb4cf">
      <text x="470" y="200">PYTHON</text>
      <rect x="650" y="189" width="160" height="10" rx="5" fill="#131a30" stroke="#2c3a5c"/>
      <rect x="650" y="189" width="0" height="10" rx="5" fill="#00fff2">
        <animate attributeName="width" values="0;150" dur="1.4s" fill="freeze" begin="0.3s"/>
      </rect>

      <text x="470" y="225">MACHINE LEARNING</text>
      <rect x="650" y="214" width="160" height="10" rx="5" fill="#131a30" stroke="#2c3a5c"/>
      <rect x="650" y="214" width="0" height="10" rx="5" fill="#8a2fff">
        <animate attributeName="width" values="0;142" dur="1.4s" fill="freeze" begin="0.5s"/>
      </rect>

      <text x="470" y="250">DEEP LEARNING</text>
      <rect x="650" y="239" width="160" height="10" rx="5" fill="#131a30" stroke="#2c3a5c"/>
      <rect x="650" y="239" width="0" height="10" rx="5" fill="#ff2fd6">
        <animate attributeName="width" values="0;128" dur="1.4s" fill="freeze" begin="0.7s"/>
      </rect>
    </g>

    <!-- badge chips -->
    <g font-size="13" font-weight="bold">
      <rect x="470" y="270" width="90" height="26" rx="13" fill="none" stroke="#00fff2"/>
      <text x="490" y="287" fill="#00fff2">LVL 99</text>

      <rect x="572" y="270" width="120" height="26" rx="13" fill="none" stroke="#8a2fff"/>
      <text x="588" y="287" fill="#8a2fff">DATA WIZARD</text>

      <rect x="704" y="270" width="130" height="26" rx="13" fill="none" stroke="#ff2fd6"/>
      <text x="720" y="287" fill="#ff2fd6">OPEN TO WORK</text>
    </g>

    <text x="470" y="325" fill="#5d6f92" font-size="13">
      ↓ Scroll down to explore my quests (projects) below ↓
    </text>
  </g>

  <!-- ============ GAMIFIED CHAT TERMINAL ============ -->
  <g font-family="Consolas, 'Courier New', monospace">
    <!-- terminal window -->
    <rect x="40" y="380" width="920" height="280" rx="14" fill="#0a0f1f" stroke="url(#neonEdge)" stroke-width="1.5" opacity="0.95"/>
    <!-- title bar -->
    <rect x="40" y="380" width="920" height="34" rx="14" fill="#131a30"/>
    <rect x="40" y="398" width="920" height="16" fill="#131a30"/>
    <circle cx="64" cy="397" r="5" fill="#ff5f56"/>
    <circle cx="82" cy="397" r="5" fill="#ffbd2e"/>
    <circle cx="100" cy="397" r="5" fill="#27c93f"/>
    <text x="480" y="402" fill="#7df9ff" font-size="13" text-anchor="middle" letter-spacing="1">ARIA_TERMINAL — LIVE_FEED.log</text>

    <!-- ===== PERMANENT NAME + BIO BLOCK — edit the two lines below with your info ===== -->
    <rect x="60" y="426" width="880" height="70" rx="8" fill="#0d1730" stroke="#2c3a5c" stroke-width="1"/>
    <text x="76" y="450" fill="#00fff2" font-size="16" font-weight="bold">
      NAME: <tspan fill="#ffffff">SOUPTIK MITRA</tspan>
    </text>
    <text x="76" y="475" fill="#8a2fff" font-size="14" font-weight="bold">
      ABOUT: <tspan fill="#c8d6f0" font-weight="normal">I turn raw messy data into meaningful insights and visuals to take decision which shapes the future</tspan>
    </text>

    <!-- avatar chip -->
    <circle cx="80" cy="522" r="18" fill="#0d1730" stroke="#00fff2" stroke-width="1.5"/>
    <text x="80" y="528" font-size="16" text-anchor="middle">🤖</text>

    <!-- cycling dialogue lines: EDIT THESE 5 LINES WITH YOUR OWN INFO -->
    <g font-size="15">
      <text x="112" y="518" fill="#00fff2" opacity="0">
        <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.02;0.18;0.2" dur="10s" repeatCount="indefinite"/>
        🏆 Achievement Unlocked: 50+ Repositories Shipped
      </text>
      <text x="112" y="518" fill="#8a2fff" opacity="0">
        <animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.2;0.22;0.38;0.4" dur="10s" repeatCount="indefinite"/>
        📊 STAT BOOST: 1+ Years Building ML Systems
      </text>
      <text x="112" y="518" fill="#ff2fd6" opacity="0">
        <animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.4;0.42;0.58;0.6" dur="10s" repeatCount="indefinite"/>
        🎯 QUEST LOG: Deployed 2+ End-to-End AI Pipelines
      </text>
      <text x="112" y="518" fill="#ffe066" opacity="0">
        <animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.6;0.62;0.78;0.8" dur="10s" repeatCount="indefinite"/>
        💾 SAVE POINT: Open-Source Contributor since 2025
      </text>
      <text x="112" y="518" fill="#7df9ff" opacity="0">
        <animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.8;0.82;0.98;1" dur="10s" repeatCount="indefinite"/>
        🔥 CURRENT MISSION: Building Agentic AI systems
      </text>
    </g>

    <!-- divider -->
    <rect x="60" y="540" width="880" height="1" fill="#1c2a3f"/>

    <!-- second row of rotating fun-fact bubbles -->
    <g font-size="14">
      <text x="70" y="568" fill="#c8d6f0" opacity="0">
        <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.02;0.31;0.33" dur="12s" repeatCount="indefinite"/>
        &gt; loaded_skill: "Turning messy data into decisions" ✅
      </text>
      <text x="70" y="568" fill="#c8d6f0" opacity="0">
        <animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.33;0.35;0.64;0.66" dur="12s" repeatCount="indefinite"/>
        &gt; loaded_skill: "Coffee-to-code conversion rate: 99%" ☕
      </text>
      <text x="70" y="568" fill="#c8d6f0" opacity="0">
        <animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.66;0.68;0.98;1" dur="12s" repeatCount="indefinite"/>
        &gt; loaded_skill: "Always debugging, never boring" 🐛
      </text>
    </g>

    <!-- prompt line with blinking cursor -->
    <text x="70" y="614" fill="#00fff2" font-size="15">visitor@github:~$ explore --projects</text>
    <rect x="330" y="602" width="9" height="15" fill="#00fff2">
      <animate attributeName="opacity" values="1;0;1" dur="0.9s" repeatCount="indefinite"/>
    </rect>

    <text x="70" y="642" fill="#5d6f92" font-size="12">
      Type nothing — just scroll. My repos do the talking. 👇
    </text>
  </g>

  <!-- bottom scan accent -->
  <rect x="0" y="692" width="1000" height="2" fill="#1c2a3f"/>
  <rect x="0" y="692" width="150" height="2" fill="url(#neonEdge)">
    <animate attributeName="x" values="0;850;0" dur="5s" repeatCount="indefinite"/>
  </rect>
</svg>
